name: Terramate Action Tests

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  simple:
    name: Default action without asdf config should fail.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest Terramate (this will fail)
        id: install
        continue-on-error: true
        uses: ./

      - name: Validate that previous installation failed
        run: test "${{steps.install.outcome}}" = "failure"

  asdf:
    name: ${{ matrix.product }} ${{ matrix.version }} asdf on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        product:
          - terramate
          # - terramate-catalyst
        version: [0.13.3, 0.14.7, skip]
        include:
          - product: terramate-catalyst
            version: 0.14.7-beta2
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare asdf config
        if: ${{ matrix.version != 'skip' }}
        run: echo "${{ matrix.product }} ${{ matrix.version}}" >.tool-versions

      - name: Prepare empty asdf config
        if: ${{ matrix.version == 'skip' }}
        run: echo >.tool-versions

      - name: Install asdf Terramate
        id: install
        continue-on-error: true
        uses: ./
        with:
          use_catalyst: "${{ matrix.product == 'terramate-catalyst'}}"

      - name: Validate that previous installation failed
        if: ${{ matrix.version == 'skip' }}
        run: test "${{ steps.install.outcome }}" = "failure"

      - name: Validate that previous installation succeeded
        if: ${{ matrix.version != 'skip' }}
        run: test "${{ steps.install.outcome }}" = "success"

      - name: Validate execution
        if: ${{ matrix.version != 'skip' }}
        run: terramate version

      - name: Validate version - ${{ matrix.version }}
        id: version
        if: ${{ matrix.version != 'skip' }}
        run: terramate version | grep ${{ matrix.version }}

      - name: Validate outputs - ${{ matrix.version }}
        if: ${{ matrix.version != 'skip' }}
        run: echo "${{ steps.version.outputs.stdout }}" | grep ${{ matrix.version }}

  wrapper:
    name: ${{ matrix.product }} ${{ matrix.version }} with wrapper on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        product:
          - terramate
          # - terramate-catalyst
        version: [0.14.7, latest]
        include:
          - product: terramate-catalyst
            version: 0.14.7-beta2
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terramate Wrapper - ${{ matrix.version }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          use_catalyst: "${{ matrix.product == 'terramate-catalyst'}}"

      - name: Validate execution - ${{ matrix.version }}
        run: terramate version

      - name: Validate version - ${{ matrix.version }}
        id: version
        if: ${{ matrix.version != 'latest' }}
        run: terramate version | grep ${{ matrix.version }}

      - name: Validate outputs - ${{ matrix.version }}
        if: ${{ matrix.version != 'latest' }}
        run: echo "${{ steps.version.outputs.stdout }}" | grep ${{ matrix.version }}

  no-wrapper:
    name: ${{ matrix.product }} ${{ matrix.version }} without wrapper on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        product:
          - terramate
          # - terramate-catalyst
        version: [0.14.7, latest]
        include:
          - product: terramate-catalyst
            version: 0.14.7-beta2
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terramate - ${{ matrix.version }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          use_wrapper: false
          use_catalyst: "${{ matrix.product == 'terramate-catalyst'}}"

      - name: Validate execution - ${{ matrix.version }}
        run: terramate version

      - name: Validate - ${{ matrix.version }}
        if: ${{ matrix.version != 'latest' }}
        run: terramate version | grep ${{ matrix.version }}

  bindir:
    name: ${{ matrix.product }} ${{ matrix.version }} custom bindir ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        product:
          - terramate
          # - terramate-catalyst
        version: [0.14.7, latest]
        include:
          - product: terramate-catalyst
            version: 0.14.7-beta2
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terramate - ${{ matrix.version }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          use_wrapper: false
          use_catalyst: "${{ matrix.product == 'terramate-catalyst'}}"
          bindir: ${{ runner.temp }}/custom-bin

      - name: Validate execution - ${{ matrix.version }}
        run: terramate version

      - name: Validate - ${{ matrix.version }}
        if: ${{ matrix.version != 'latest' }}
        run: terramate version | grep ${{ matrix.version }}
